    // ─── Small components ────────────────────────────────────────────────────────

    function MuscleTag({ muscle }) {
      const c = muscleColor[muscle] || "#94a3b8";
      return (
        <span style={{
          background: c + "22", color: c, border: "1px solid " + c + "55",
          borderRadius: "4px", padding: "1px 6px", fontSize: "11px",
          fontWeight: 600, letterSpacing: "0.03em", whiteSpace: "nowrap",
        }}>{muscle}</span>
      );
    }

    function CardioTag() {
      return (
        <span style={{
          background: "#fbbf2422", color: "#fbbf24", border: "1px solid #fbbf2455",
          borderRadius: "4px", padding: "1px 6px", fontSize: "11px", fontWeight: 600,
        }}>Cardio / Warmup</span>
      );
    }

    function FilterBar({ filterMuscle, setFilterMuscle, filterEquip, setFilterEquip }) {
      const equipments       = ["All", ...Array.from(new Set(EXERCISES.map(e => e.equipment))).sort()];
      const allMuscleOptions = ["All", ...MUSCLE_GROUPS];
      const sel = { width: "100%", background: "#0f172a", border: "1px solid #1e3a5f", color: "#e2e8f0",
        borderRadius: "8px", padding: "8px 10px", fontSize: "13px", fontFamily: "'DM Sans',sans-serif" };
      return (
        <div style={{ padding: "12px 16px", borderBottom: "1px solid #1e293b", display: "flex", gap: "10px" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "10px", color: "#64748b", fontWeight: 700, letterSpacing: "0.08em", marginBottom: "4px" }}>MUSCLE</div>
            <select value={filterMuscle} onChange={e => setFilterMuscle(e.target.value)} style={sel}>
              {allMuscleOptions.map(o => <option key={o}>{o}</option>)}
            </select>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: "10px", color: "#64748b", fontWeight: 700, letterSpacing: "0.08em", marginBottom: "4px" }}>EQUIPMENT</div>
            <select value={filterEquip} onChange={e => setFilterEquip(e.target.value)} style={sel}>
              {equipments.map(o => <option key={o}>{o}</option>)}
            </select>
          </div>
        </div>
      );
    }

    function MenuCard({ ex, onAdd, covered, flashing }) {
      return (
        <div style={{
          background: flashing ? "#1e3a5f" : (covered ? "#0a0f18" : "#0f172a"),
          border: "1px solid " + (flashing ? "#4ade80" : covered ? "#1e293b" : "#1e3a5f"),
          borderRadius: "10px", padding: "12px 14px", opacity: covered ? 0.4 : 1,
          transition: "background 0.2s, border-color 0.2s",
          display: "flex", alignItems: "flex-start", gap: "10px",
        }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: 600, fontSize: "14px", color: covered ? "#475569" : "#e2e8f0", marginBottom: "3px" }}>
              {ex.name}
            </div>
            <div style={{ fontSize: "11px", color: "#475569", fontStyle: "italic", marginBottom: "6px" }}>
              {ex.equipment}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", marginBottom: (!covered && ex.note) ? "6px" : "0" }}>
              {ex.cardioOnly ? <CardioTag /> : ex.muscles.map(m => <MuscleTag key={m} muscle={m} />)}
            </div>
            {!covered && ex.note && (
              <div style={{ fontSize: "12px", color: "#64748b", lineHeight: 1.4 }}>{ex.note}</div>
            )}
          </div>
          {onAdd && (
            <button
              onClick={onAdd}
              style={{
                background: flashing ? "#4ade80" : "#1d4ed8", border: "none", borderRadius: "8px",
                color: flashing ? "#000" : "#fff", fontWeight: 700, fontSize: "20px",
                width: "40px", height: "40px", flexShrink: 0, cursor: "pointer",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "background 0.2s, color 0.2s",
              }}
            >{flashing ? "✓" : "+"}</button>
          )}
        </div>
      );
    }

    function LibraryCard({ ex }) {
      return (
        <div style={{ background: "#0f172a", border: "1px solid #1e3a5f", borderRadius: "10px", padding: "13px 14px" }}>
          <div style={{ fontWeight: 600, fontSize: "14px", color: "#e2e8f0", marginBottom: "3px" }}>{ex.name}</div>
          <div style={{ fontSize: "11px", color: "#475569", fontStyle: "italic", marginBottom: "7px" }}>{ex.equipment}</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", marginBottom: "6px" }}>
            {ex.cardioOnly ? <CardioTag /> : ex.muscles.map(m => <MuscleTag key={m} muscle={m} />)}
          </div>
          <div style={{ fontSize: "12px", color: "#64748b", lineHeight: 1.4 }}>{ex.note}</div>
        </div>
      );
    }

    // ─── Tab screens ─────────────────────────────────────────────────────────────

    function LogScreen({ weeks, activeWeekId, activeWorkoutId, setActiveWorkoutId, addWorkout, deleteWorkout, removeExercise, setShowWeekSheet, setTab }) {
      const activeWeek    = weeks.find(w => w.id === activeWeekId);
      const activeWorkout = activeWeek && activeWeek.workouts.find(w => w.id === activeWorkoutId);

      return (
        <div style={{ flex: 1, overflowY: "auto", padding: "16px" }}>
          <div style={{ display: "flex", alignItems: "center", gap: "10px", marginBottom: "16px" }}>
            <button
              onClick={() => setShowWeekSheet(true)}
              style={{
                flex: 1, background: "#0f172a", border: "1px solid #1e3a5f", borderRadius: "10px",
                padding: "10px 14px", color: "#e2e8f0", fontWeight: 600, fontSize: "14px",
                textAlign: "left", cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
                display: "flex", justifyContent: "space-between", alignItems: "center",
              }}
            >
              <span>{activeWeek ? activeWeek.label : "No week"}</span>
              <span style={{ fontSize: "11px", color: "#64748b", fontWeight: 400 }}>change</span>
            </button>
            <button
              onClick={addWorkout}
              style={{
                background: "#1d4ed8", border: "none", borderRadius: "10px", padding: "10px 14px",
                color: "#fff", fontWeight: 700, fontSize: "13px", cursor: "pointer",
                fontFamily: "'DM Sans',sans-serif", whiteSpace: "nowrap",
              }}
            >+ Workout</button>
          </div>

          {(!activeWeek || activeWeek.workouts.length === 0) && (
            <div style={{ textAlign: "center", color: "#334155", fontSize: "14px", marginTop: "60px" }}>
              <div style={{ fontSize: "36px", marginBottom: "12px" }}>🏋️</div>
              No workouts yet.
              <br />
              Tap <strong style={{ color: "#60a5fa" }}>+ Workout</strong> to get started.
            </div>
          )}

          {activeWeek && activeWeek.workouts.length > 0 && (
            <>
              <div style={{ display: "flex", gap: "8px", overflowX: "auto", marginBottom: "16px", paddingBottom: "4px" }}>
                {activeWeek.workouts.map(wo => (
                  <div key={wo.id} style={{
                    display: "flex", alignItems: "center", flexShrink: 0,
                    background: activeWorkoutId === wo.id ? "#1e3a5f" : "#0f172a",
                    border: "1px solid " + (activeWorkoutId === wo.id ? "#3b82f6" : "#1e293b"),
                    borderRadius: "8px", overflow: "hidden",
                  }}>
                    <button
                      onClick={() => setActiveWorkoutId(wo.id)}
                      style={{
                        background: "none", border: "none", padding: "8px 12px",
                        color: activeWorkoutId === wo.id ? "#60a5fa" : "#94a3b8",
                        fontWeight: activeWorkoutId === wo.id ? 700 : 400,
                        fontSize: "13px", cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
                        whiteSpace: "nowrap",
                      }}
                    >{wo.label}</button>
                    <button
                      onClick={() => deleteWorkout(wo.id)}
                      style={{
                        background: "none", border: "none", borderLeft: "1px solid #1e293b",
                        color: "#475569", cursor: "pointer", padding: "8px 10px", fontSize: "16px", lineHeight: 1,
                      }}
                    >×</button>
                  </div>
                ))}
              </div>

              {activeWorkout ? (
                <>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
                    <div style={{ fontSize: "12px", fontWeight: 700, color: "#64748b", letterSpacing: "0.08em" }}>
                      {activeWorkout.label.toUpperCase()} — LOG
                    </div>
                    <button
                      onClick={() => setTab("menu")}
                      style={{
                        background: "#1d4ed8", border: "none", borderRadius: "8px", padding: "8px 14px",
                        color: "#fff", fontWeight: 700, fontSize: "13px", cursor: "pointer",
                        fontFamily: "'DM Sans',sans-serif",
                      }}
                    >+ Add Exercise</button>
                  </div>

                  {activeWorkout.exercises.length === 0 ? (
                    <div style={{ textAlign: "center", color: "#334155", fontSize: "13px", marginTop: "30px" }}>
                      Tap <strong style={{ color: "#60a5fa" }}>+ Add Exercise</strong> to build this workout.
                    </div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      {activeWorkout.exercises.map((ex, i) => (
                        <div key={i} style={{
                          background: "#0f172a", border: "1px solid #1e3a5f", borderRadius: "10px",
                          padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "flex-start",
                        }}>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontWeight: 600, fontSize: "14px", color: "#e2e8f0", marginBottom: "5px" }}>{ex.name}</div>
                            <div style={{ display: "flex", flexWrap: "wrap", gap: "4px" }}>
                              {ex.cardioOnly ? <CardioTag /> : ex.muscles.map(m => <MuscleTag key={m} muscle={m} />)}
                            </div>
                          </div>
                          <button
                            onClick={() => removeExercise(i)}
                            style={{
                              background: "none", border: "none", color: "#475569",
                              cursor: "pointer", fontSize: "22px", padding: "0 0 0 12px", lineHeight: 1, flexShrink: 0,
                            }}
                          >×</button>
                        </div>
                      ))}
                    </div>
                  )}
                </>
              ) : (
                <div style={{ textAlign: "center", color: "#334155", fontSize: "13px", marginTop: "20px" }}>
                  Select a workout above.
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    function MenuScreen({ weeks, activeWeekId, activeWorkoutId, addExercise, addedFlash, filterMuscle, setFilterMuscle, filterEquip, setFilterEquip }) {
      const activeWeek    = weeks.find(w => w.id === activeWeekId);
      const activeWorkout = activeWeek && activeWeek.workouts.find(w => w.id === activeWorkoutId);

      const weekTargetedMuscles = new Set(
        (activeWeek ? activeWeek.workouts : []).flatMap(wo => wo.exercises.flatMap(e => e.muscles))
      );

      function isFullyCovered(ex) {
        if (ex.cardioOnly || !ex.muscles.length) return false;
        return ex.muscles.every(m => weekTargetedMuscles.has(m));
      }

      const filtered = EXERCISES.filter(e =>
        (filterMuscle === "All" || e.muscles.includes(filterMuscle)) &&
        (filterEquip  === "All" || e.equipment === filterEquip)
      );
      const available = filtered.filter(e => !isFullyCovered(e));
      const covered   = filtered.filter(e =>  isFullyCovered(e));

      return (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ padding: "10px 16px", background: "#080e1a", borderBottom: "1px solid #1e293b" }}>
            {activeWorkoutId ? (
              <div style={{ fontSize: "12px", color: "#60a5fa", fontWeight: 600 }}>
                Adding to: {activeWeek && activeWeek.label} — {activeWorkout && activeWorkout.label}
                <span style={{ color: "#64748b", fontWeight: 400 }}> (tap + to add)</span>
              </div>
            ) : (
              <div style={{ fontSize: "12px", color: "#f59e0b", fontWeight: 600 }}>
                No workout selected — go to Log and select one first
              </div>
            )}
          </div>

          <FilterBar filterMuscle={filterMuscle} setFilterMuscle={setFilterMuscle} filterEquip={filterEquip} setFilterEquip={setFilterEquip} />

          <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px" }}>
            {activeWorkoutId ? (
              <>
                {available.length > 0 && (
                  <>
                    <div style={{ fontSize: "11px", color: "#4ade80", fontWeight: 700, letterSpacing: "0.08em", marginBottom: "8px" }}>
                      AVAILABLE — ADDS NEW COVERAGE
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px", marginBottom: "20px" }}>
                      {available.map(ex => (
                        <MenuCard key={ex.id} ex={ex} onAdd={() => addExercise(ex)} covered={false} flashing={addedFlash === ex.id} />
                      ))}
                    </div>
                  </>
                )}
                {covered.length > 0 && (
                  <>
                    <div style={{ fontSize: "11px", color: "#475569", fontWeight: 700, letterSpacing: "0.08em", marginBottom: "8px" }}>
                      ALREADY COVERED THIS WEEK
                    </div>
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      {covered.map(ex => (
                        <MenuCard key={ex.id} ex={ex} onAdd={() => addExercise(ex)} covered={true} flashing={addedFlash === ex.id} />
                      ))}
                    </div>
                  </>
                )}
              </>
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                {filtered.map(ex => <MenuCard key={ex.id} ex={ex} onAdd={null} covered={false} flashing={false} />)}
              </div>
            )}
          </div>
        </div>
      );
    }

    function CoverageScreen({ weeks, activeWeekId }) {
      const activeWeek = weeks.find(w => w.id === activeWeekId);
      const weekTargetedMuscles = new Set(
        (activeWeek ? activeWeek.workouts : []).flatMap(wo => wo.exercises.flatMap(e => e.muscles))
      );
      const coveredCount = MUSCLE_GROUPS.filter(m => weekTargetedMuscles.has(m)).length;
      const progressPct  = Math.round((coveredCount / MUSCLE_GROUPS.length) * 100);

      return (
        <div style={{ flex: 1, overflowY: "auto", padding: "16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "12px" }}>
            <div style={{ fontWeight: 700, fontSize: "16px", color: "#f1f5f9" }}>
              {activeWeek ? activeWeek.label : "—"} Coverage
            </div>
            <div style={{ fontSize: "26px", fontWeight: 700, fontFamily: "'DM Mono',monospace", color: progressPct === 100 ? "#4ade80" : "#60a5fa" }}>
              {progressPct}%
            </div>
          </div>
          <div style={{ background: "#0f172a", borderRadius: "6px", height: "6px", marginBottom: "20px", overflow: "hidden" }}>
            <div style={{ width: progressPct + "%", height: "100%", background: progressPct === 100 ? "#4ade80" : "#3b82f6", borderRadius: "6px", transition: "width 0.3s ease" }} />
          </div>
          {COVERAGE_SECTIONS.map(sec => (
            <div key={sec.label} style={{ marginBottom: "16px" }}>
              <div style={{ fontSize: "11px", color: "#64748b", fontWeight: 700, letterSpacing: "0.1em", marginBottom: "8px" }}>
                {sec.label.toUpperCase()}
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: "6px" }}>
                {sec.muscles.map(m => {
                  const hit = weekTargetedMuscles.has(m);
                  const c   = muscleColor[m];
                  return (
                    <span key={m} style={{
                      background: hit ? c + "22" : "#0a0f18",
                      color: hit ? c : "#334155",
                      border: "1px solid " + (hit ? c + "55" : "#1e293b"),
                      borderRadius: "6px", padding: "5px 10px",
                      fontSize: "12px", fontWeight: 600, transition: "all 0.2s ease",
                    }}>{hit ? "✓ " : ""}{m}</span>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function LibraryScreen({ filterMuscle, setFilterMuscle, filterEquip, setFilterEquip }) {
      const filtered = EXERCISES.filter(e =>
        (filterMuscle === "All" || e.muscles.includes(filterMuscle)) &&
        (filterEquip  === "All" || e.equipment === filterEquip)
      );
      return (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <FilterBar filterMuscle={filterMuscle} setFilterMuscle={setFilterMuscle} filterEquip={filterEquip} setFilterEquip={setFilterEquip} />
          <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px" }}>
            <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
              {filtered.map(ex => <LibraryCard key={ex.id} ex={ex} />)}
            </div>
          </div>
        </div>
      );
    }

    function WeekSheet({ weeks, activeWeekId, setActiveWeekId, setActiveWorkoutId, addWeek, deleteWeek, onClose }) {
      return (
        <div
          onClick={onClose}
          style={{ position: "fixed", inset: 0, zIndex: 100, background: "#00000088", display: "flex", flexDirection: "column", justifyContent: "flex-end" }}
        >
          <div
            onClick={e => e.stopPropagation()}
            style={{ background: "#0f172a", borderRadius: "16px 16px 0 0", border: "1px solid #1e293b", padding: "20px 16px 36px", maxHeight: "70vh", overflowY: "auto" }}
          >
            <div style={{ width: "40px", height: "4px", background: "#334155", borderRadius: "2px", margin: "0 auto 16px" }} />
            <div style={{ fontWeight: 700, fontSize: "16px", color: "#f1f5f9", marginBottom: "14px" }}>Select Week</div>
            {weeks.map(w => (
              <div key={w.id} style={{ display: "flex", alignItems: "center", gap: "8px", marginBottom: "8px" }}>
                <button
                  onClick={() => { setActiveWeekId(w.id); setActiveWorkoutId(null); onClose(); }}
                  style={{
                    flex: 1, background: activeWeekId === w.id ? "#1e3a5f" : "#080e1a",
                    border: "1px solid " + (activeWeekId === w.id ? "#3b82f6" : "#1e293b"),
                    borderRadius: "10px", padding: "11px 14px",
                    color: activeWeekId === w.id ? "#60a5fa" : "#94a3b8",
                    fontWeight: activeWeekId === w.id ? 700 : 400,
                    fontSize: "14px", textAlign: "left", cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
                  }}
                >{w.label}</button>
                <button
                  onClick={() => deleteWeek(w.id)}
                  style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: "8px", color: "#64748b", cursor: "pointer", fontSize: "18px", padding: "8px 12px", lineHeight: 1 }}
                >×</button>
              </div>
            ))}
            <button
              onClick={addWeek}
              style={{ width: "100%", marginTop: "10px", background: "none", border: "1px dashed #1e3a5f", borderRadius: "10px", color: "#3b82f6", padding: "11px", fontSize: "14px", fontWeight: 600, cursor: "pointer", fontFamily: "'DM Sans',sans-serif" }}
            >+ New Week</button>
          </div>
        </div>
      );
    }

    // ─── Root ─────────────────────────────────────────────────────────────────────

    const NAV_TABS = [
      { id: "log",      label: "Log",      icon: "📋" },
      { id: "menu",     label: "Add",      icon: "＋" },
      { id: "coverage", label: "Coverage", icon: "📊" },
      { id: "library",  label: "Library",  icon: "📚" },
    ];

    function App() {
      const [tab, setTab]                         = useState("log");
      const [weeks, setWeeks]                     = useState(() => {
        try { const s = localStorage.getItem('ironlog-weeks'); return s ? JSON.parse(s) : [{ id: 1, label: "Week 1", workouts: [] }]; }
        catch { return [{ id: 1, label: "Week 1", workouts: [] }]; }
      });
      const [activeWeekId, setActiveWeekId]       = useState(() => {
        try { const s = localStorage.getItem('ironlog-activeWeekId'); return s ? JSON.parse(s) : 1; }
        catch { return 1; }
      });
      const [activeWorkoutId, setActiveWorkoutId] = useState(null);
      const [filterMuscle, setFilterMuscle]       = useState("All");
      const [filterEquip, setFilterEquip]         = useState("All");
      const [showWeekSheet, setShowWeekSheet]     = useState(false);
      const [addedFlash, setAddedFlash]           = useState(null);

      useEffect(() => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap";
        document.head.appendChild(link);
      }, []);

      useEffect(() => { try { localStorage.setItem('ironlog-weeks', JSON.stringify(weeks)); } catch {} }, [weeks]);
      useEffect(() => { try { localStorage.setItem('ironlog-activeWeekId', JSON.stringify(activeWeekId)); } catch {} }, [activeWeekId]);

      function addWeek() {
        const id = Date.now();
        setWeeks(prev => [...prev, { id, label: "Week " + (prev.length + 1), workouts: [] }]);
        setActiveWeekId(id);
        setActiveWorkoutId(null);
        setShowWeekSheet(false);
      }

      function deleteWeek(id) {
        const rest = weeks.filter(w => w.id !== id);
        setWeeks(rest);
        if (activeWeekId === id) {
          setActiveWeekId(rest.length ? rest[rest.length - 1].id : null);
          setActiveWorkoutId(null);
        }
      }

      function addWorkout() {
        const activeWeek = weeks.find(w => w.id === activeWeekId);
        if (!activeWeek) return;
        const id = Date.now();
        setWeeks(prev => prev.map(w =>
          w.id === activeWeekId
            ? { ...w, workouts: [...w.workouts, { id, label: "Workout " + (w.workouts.length + 1), exercises: [] }] }
            : w
        ));
        setActiveWorkoutId(id);
        setTab("log");
      }

      function deleteWorkout(id) {
        setWeeks(prev => prev.map(w =>
          w.id === activeWeekId ? { ...w, workouts: w.workouts.filter(wo => wo.id !== id) } : w
        ));
        if (activeWorkoutId === id) setActiveWorkoutId(null);
      }

      function addExercise(ex) {
        if (!activeWorkoutId) return;
        setWeeks(prev => prev.map(w =>
          w.id === activeWeekId
            ? { ...w, workouts: w.workouts.map(wo =>
                wo.id === activeWorkoutId ? { ...wo, exercises: [...wo.exercises, ex] } : wo
              )}
            : w
        ));
        setAddedFlash(ex.id);
        setTimeout(() => setAddedFlash(null), 900);
      }

      function removeExercise(idx) {
        setWeeks(prev => prev.map(w =>
          w.id === activeWeekId
            ? { ...w, workouts: w.workouts.map(wo =>
                wo.id === activeWorkoutId
                  ? { ...wo, exercises: wo.exercises.filter((_, i) => i !== idx) }
                  : wo
              )}
            : w
        ));
      }

      return (
        <div style={{
          height: "100dvh", background: "#060d18", color: "#e2e8f0",
          fontFamily: "'DM Sans','Segoe UI',sans-serif",
          display: "flex", flexDirection: "column",
          maxWidth: "600px", margin: "0 auto", position: "relative",
        }}>
          <style>{`
            * { box-sizing: border-box; margin: 0; padding: 0; }
            ::-webkit-scrollbar { width: 3px; }
            ::-webkit-scrollbar-track { background: #0a0f18; }
            ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 4px; }
            button:focus { outline: none; }
            select:focus { outline: none; }
          `}</style>

          {/* Header */}
          <div style={{ padding: "13px 16px 10px", borderBottom: "1px solid #1e293b", display: "flex", alignItems: "center", gap: "10px", flexShrink: 0 }}>
            <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
              <rect x="3" y="11" width="22" height="6" rx="3" fill="#3b82f6" />
              <rect x="0" y="12" width="5" height="4" rx="2" fill="#60a5fa" />
              <rect x="23" y="12" width="5" height="4" rx="2" fill="#60a5fa" />
              <rect x="11" y="7" width="6" height="14" rx="2" fill="#1d4ed8" />
            </svg>
            <span style={{ fontSize: "17px", fontWeight: 700, letterSpacing: "-0.5px", color: "#f1f5f9" }}>IRON LOG</span>
          </div>

          {/* Screen content */}
          <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
            {tab === "log" && (
              <LogScreen
                weeks={weeks} activeWeekId={activeWeekId} activeWorkoutId={activeWorkoutId}
                setActiveWorkoutId={setActiveWorkoutId} addWorkout={addWorkout}
                deleteWorkout={deleteWorkout} removeExercise={removeExercise}
                setShowWeekSheet={setShowWeekSheet} setTab={setTab}
              />
            )}
            {tab === "menu" && (
              <MenuScreen
                weeks={weeks} activeWeekId={activeWeekId} activeWorkoutId={activeWorkoutId}
                addExercise={addExercise} addedFlash={addedFlash}
                filterMuscle={filterMuscle} setFilterMuscle={setFilterMuscle}
                filterEquip={filterEquip} setFilterEquip={setFilterEquip}
              />
            )}
            {tab === "coverage" && (
              <CoverageScreen weeks={weeks} activeWeekId={activeWeekId} />
            )}
            {tab === "library" && (
              <LibraryScreen
                filterMuscle={filterMuscle} setFilterMuscle={setFilterMuscle}
                filterEquip={filterEquip} setFilterEquip={setFilterEquip}
              />
            )}
          </div>

          {/* Bottom nav */}
          <div style={{ borderTop: "1px solid #1e293b", background: "#080e1a", display: "flex", flexShrink: 0 }}>
            {NAV_TABS.map(n => (
              <button
                key={n.id}
                onClick={() => setTab(n.id)}
                style={{
                  flex: 1, background: "none", border: "none",
                  borderTop: "2px solid " + (tab === n.id ? "#3b82f6" : "transparent"),
                  padding: "10px 4px 12px",
                  color: tab === n.id ? "#60a5fa" : "#475569",
                  cursor: "pointer", fontFamily: "'DM Sans',sans-serif",
                  transition: "color 0.15s",
                }}
              >
                <div style={{ fontSize: "18px", marginBottom: "2px" }}>{n.icon}</div>
                <div style={{ fontSize: "10px", fontWeight: 600, letterSpacing: "0.05em" }}>{n.label.toUpperCase()}</div>
              </button>
            ))}
          </div>

          {/* Week sheet modal */}
          {showWeekSheet && (
            <WeekSheet
              weeks={weeks} activeWeekId={activeWeekId}
              setActiveWeekId={setActiveWeekId} setActiveWorkoutId={setActiveWorkoutId}
              addWeek={addWeek} deleteWeek={deleteWeek}
              onClose={() => setShowWeekSheet(false)}
            />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered, scope:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
